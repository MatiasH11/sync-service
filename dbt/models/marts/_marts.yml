version: 2

models:
  - name: fct_sales
    description: >
      Sales fact table. Single source of truth for api-vendedores and api-quantix.
      Replaces fct_sales (DuckDB) and RENT_COMERCIAL (MySQL).
      Design: comprobante is truth, enrichments are lookups, only PP is processed,
      flags for complex detection (GM, secondary), no pre-aggregations.
      Lineage: stg_sales → int_sales_accounts → int_sales_gm → int_sales_enriched → int_sales_pp → fct_sales.
    columns:

      # -----------------------------------------------------------------------
      # Comprobante
      # -----------------------------------------------------------------------
      - name: source
        description: "Comprobante. MySQL source database: DIMDS, DIMPPAL, DISDS, DISPPAL"
        tests:
          - not_null
          - accepted_values:
              values: ['DIMDS', 'DIMPPAL', 'DISDS', 'DISPPAL']
      - name: voucher_type
        description: "Comprobante. FA, FB, NCA, NCB, NDA, NDB, RE"
        tests: [not_null]
      - name: voucher_number
        description: "Comprobante. Invoice number"
        tests: [not_null]
      - name: voucher_line
        description: "Comprobante. Line number within the invoice body (NROLINEA)"
        tests: [not_null]
      - name: point_of_sale
        description: "Comprobante. Point of sale number (NROPUNTODEVENTA)"
        tests: [not_null]
      - name: deposit_code
        description: "Comprobante. Article-level deposit code (CODIGODEPOSITO)"

      # -----------------------------------------------------------------------
      # Temporal
      # -----------------------------------------------------------------------
      - name: invoice_datetime
        description: "Comprobante. Full timestamp of the invoice"
        tests: [not_null]
      - name: year_month
        description: "Calculated. YYYY-MM from invoice_datetime. Use for GROUP BY and partitioning."
        tests: [not_null]

      # -----------------------------------------------------------------------
      # Classification (calculated)
      # -----------------------------------------------------------------------
      - name: branch
        description: "Calculated. BA | MDP | PICO | ROSARIO | UNKNOWN — derived from point_of_sale + deposit_code"
        tests: [not_null]
      - name: consumption_type
        description: "Calculated. DS or PPAL — derived from source database"
        tests:
          - not_null
          - accepted_values:
              values: ['DS', 'PPAL']

      # -----------------------------------------------------------------------
      # Client
      # -----------------------------------------------------------------------
      - name: client_code
        description: "Comprobante. Original client code from the invoice"
        tests: [not_null]
      - name: account_code
        description: "Enriched. Resolved main account code. Use this for all joins and aggregations."
        tests: [not_null]
      - name: account_name
        description: "Enriched. Name of the main account"
        tests: [not_null]
      - name: client_particular_code
        description: "Enriched. Particular/external code from client-service. Key for api-quantix."
      - name: vendor_code
        description: "Enriched. Vendor assigned to the main account"
      - name: vendor_name
        description: "Enriched. Vendor name"
      - name: zone_code
        description: "Enriched. Commercial zone code"

      # -----------------------------------------------------------------------
      # Article
      # -----------------------------------------------------------------------
      - name: article_code
        description: "Comprobante. Article code"
        tests: [not_null]
      - name: article_particular_code
        description: "Enriched. Particular code — coalesce(product-service master, invoice value)"
      - name: article_description
        description: "Enriched. Article description — coalesce(product-service master, invoice value)"
      - name: rubro_code
        description: "Enriched. Super-rubro code. Codes -1 and 377 → is_valid_article = false."
      - name: rubro_description
        description: "Enriched. Super-rubro description"
      - name: rubro_min_units
        description: "Enriched. Minimum units for the super-rubro. 0 if no master record. Used for SR achievement logic."
      - name: brand_code
        description: "Enriched. Integer brand code from RDS"
      - name: brand_id
        description: "Enriched. Brand UUID from product-service"
      - name: brand_name
        description: "Enriched. Brand name"
      - name: product_line_id
        description: "Enriched. Product line UUID from product-service"
      - name: product_line_name
        description: "Enriched. Product line name"

      # -----------------------------------------------------------------------
      # Provider
      # -----------------------------------------------------------------------
      - name: provider_code
        description: "Enriched. Provider code from DESC_PP_PROV keyed by article_code. NULL if article has no PP config."
      - name: provider_name
        description: "Enriched. Provider name from DESC_PP_PROV. NULL if article has no PP config."

      # -----------------------------------------------------------------------
      # Metrics
      # -----------------------------------------------------------------------
      - name: article_unit_price
        description: "Comprobante. Price per unit as invoiced (PRECIOUNITARIO)"
        tests: [not_null]
      - name: article_quantity
        description: "Comprobante. Units sold (CANTIDAD)"
        tests: [not_null]
      - name: line_discount_pct
        description: "Comprobante. Line-level discount % applied to this line (DESCUENTO)"
      - name: header_bonification_pct
        description: "Comprobante. Voucher-level bonification % (DESCUENTOPORCENTAJE / BONIFICACION)"
      - name: line_total
        description: "Comprobante. Invoice line total (PRECIOTOTAL). article_unit_price × article_quantity × (1 - line_discount_pct/100). Before header bonification."
        tests: [not_null]
      - name: sale_total
        description: "Calculated. Net sale total: line_total × (1 - header_bonification_pct/100). Equivalent to TOTAL in RENT_COMERCIAL and PRECIO in DuckDB fct_sales."
        tests: [not_null]
      - name: cost_total
        description: "Comprobante. Cost of goods for the line (COSTOVENTA)"

      # -----------------------------------------------------------------------
      # PP (Pronto Pago) — only processed totals in the table
      # -----------------------------------------------------------------------
      - name: pp_discount_pct
        description: >
          Calculated. Monthly PP discount % for the client.
          Client '01129' (Estado) always 0%.
          Source: PROMEDIO_PRONTOPAGO_V2. Fallback: 22%.
        tests: [not_null]
      - name: pp_sale_total
        description: >
          Calculated. sale_total × ((100 - pp_discount_pct) / 100).
          Equivalent to TOTAL_PP in RENT_COMERCIAL.
        tests: [not_null]
      - name: pp_provider_discount_pct
        description: >
          Enriched. PP discount % from DESC_PP_PROV keyed by article_code.
          0 if the article has no PP config. Used to calculate pp_cost_total.
      - name: pp_cost_total
        description: >
          Calculated. cost_total × ((100 - pp_provider_discount_pct) / 100).
          Equivalent to COMPRAS_PP in RENT_COMERCIAL.
        tests: [not_null]

      # -----------------------------------------------------------------------
      # Flags
      # -----------------------------------------------------------------------
      - name: is_gm_sale
        description: >
          Calculated. True if voucher_type=RE + point_of_sale IN (17,18,19,109) + barrio matches discount regex.
          Use to filter or segment GM vs non-GM sales.
        tests: [not_null]
      - name: is_secondary_account
        description: >
          Enriched. True if client is a secondary (Excel) account mapped to a main account.
          Use to exclude from aggregations to avoid double counting (main account already includes these sales).
        tests: [not_null]
      - name: is_valid_article
        description: "Calculated. False if rubro_code IN (-1, 377). Use to filter standard article aggregations."
        tests: [not_null]

  - name: fct_clients
    description: >
      Client master table. Single source of truth for api-vendedores and api-quantix.
      Replaces api-vendedores direct MySQL queries and api-quantix Redis bulk cache.
      All lookups pre-applied: seller name, account mapping, business flags, discounts.
      Lineage: raw_clients + raw_sellers → stg_clients + stg_sellers → int_clients_enriched → fct_clients.
      Rebuilt in full on every dimensions pipeline run (non-partitioned).
    columns:
      - name: client_code
        description: "Unique client code (PK). One row per client."
        tests:
          - not_null
          - unique

      - name: particular_code
        description: "Particular/external client code (codigoparticular). Primary lookup key in api-quantix."

      - name: business_name
        description: "Razón social of the client."

      - name: trade_name
        description: "Nombre de fantasía / trade name."

      - name: vendor_code
        description: "Assigned seller code. NULL if no seller assigned."

      - name: vendor_name
        description: "Resolved seller name from stg_sellers. NULL if no seller assigned."

      - name: zone_code
        description: "Commercial zone code."

      - name: neighborhood
        description: "Client neighborhood (barrio)."

      - name: city
        description: "Client city (localidad)."

      - name: address
        description: "Client street address (domicilio)."

      - name: phone
        description: "Client phone number."

      - name: latitude
        description: "Geolocation latitude. NULL for most clients initially."

      - name: longitude
        description: "Geolocation longitude. NULL for most clients initially."

      - name: is_secondary_account
        description: "True if this is a secondary (Excel) account linked to a primary account."
        tests:
          - not_null

      - name: primary_account_code
        description: "client_code of the primary account. NULL if this is already a primary account."

      - name: primary_account_particular
        description: "particular_code of the primary account. Used by api-quantix secondary-to-primary mapping."

      - name: is_active
        description: "Always TRUE. All clients returned by client-service are considered active."
        tests:
          - not_null

      - name: is_gm
        description: "True if client operates under Gran Minorista pricing (pre-computed by client-service)."
        tests:
          - not_null

      - name: is_ag
        description: "True if client is Agente segment (pre-computed by client-service)."
        tests:
          - not_null

      - name: is_agro
        description: "True if client belongs to the agro channel (pre-computed by client-service)."
        tests:
          - not_null

      - name: is_subscriber
        description: >
          True if client has dynamic field codigo=59 with valor='2' in campos_dinamicos.
          Extracted from JSONB — NOT a direct client-service field.
          Used by api-vendedores getPlanClients query.
        tests:
          - not_null

      - name: is_plan_gomeria
        description: "True if client is enrolled in the gomería plan (pre-computed by client-service)."
        tests:
          - not_null

      - name: bonus_discount
        description: "Bonus discount percentage from discounts->>'byBonus'. Default 0."
        tests:
          - not_null

      - name: general_discount
        description: "General discount percentage from discounts->>'byGeneral'. Default 0."
        tests:
          - not_null

      - name: cash_on_delivery
        description: "Contrareembolso flag (logistics). Cast from integer to boolean."

      - name: cash_on_deposit
        description: "Contradeposito flag (logistics). Cast from integer to boolean."
